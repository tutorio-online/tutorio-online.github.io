name: Sync Telegram posts

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run sync script
        run: python scripts/sync_telegram.py

      - name: Commit and push changes
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

          # Stage everything that may have changed (posts, blog.html, sitemap.xml, index2.html, index3.html, downloaded images)
          git add posts/ blog.html sitemap.xml index2.html index3.html assets/ || true

          # Bail out cleanly if no changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync Telegram posts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
